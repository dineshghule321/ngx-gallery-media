# =============================================================================
# ngx-gallery-media: checks on every pull request and push to main; publish to
# npm when a version tag (v1.2.3) is pushed.
#
# Repository variable (Repository settings > Pipelines > Repository variables):
#   NPM_TOKEN   npm granular access token with publish rights on ngx-gallery-media
#               (secured, never printed)
# =============================================================================

image: node:22.17-bookworm-slim

definitions:
  caches:
    npm-cache: ~/.npm

  steps:
    - step: &check
        name: Lint, format, tests, builds
        caches: [npm-cache]
        size: 2x
        script:
          - apt-get update && apt-get install -y --no-install-recommends chromium
          - export CHROME_BIN=/usr/bin/chromium
          - npm ci --no-audit --no-fund --prefer-offline
          - npm run check
        artifacts:
          - dist/ngx-gallery-media/**

    - step: &publish
        name: Publish to npm
        deployment: production
        script:
          - TAG_VERSION="${BITBUCKET_TAG#v}"
          - PKG_VERSION="$(node -p "require('./dist/ngx-gallery-media/package.json').version")"
          - if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then echo "Tag $BITBUCKET_TAG does not match package $PKG_VERSION"; exit 1; fi
          - if npm view "ngx-gallery-media@${PKG_VERSION}" version >/dev/null 2>&1; then echo "ngx-gallery-media@${PKG_VERSION} is already on npm; nothing to publish"; exit 0; fi
          - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          - cd dist/ngx-gallery-media && npm publish --access public

pipelines:
  pull-requests:
    '**':
      - step: *check
  branches:
    main:
      - step: *check
  tags:
    'v*':
      - step: *check
      - step: *publish
